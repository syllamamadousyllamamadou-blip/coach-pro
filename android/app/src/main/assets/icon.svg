<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradé Fond Sombre Luxe -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Dégradé Émeraude Néon -->
    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Dégradé Cyan Électrique -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Filtre Lueur Néon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond Arrondi -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#1f2d4d" stroke-width="6" opacity="0.8" />

  <!-- Écusson Athlétique Géométrique -->
  <g transform="translate(256, 230)">
    <!-- Lueur d'arrière-plan -->
    <path d="M0 -140 L120 -60 L120 70 L0 150 L-120 70 L-120 -60 Z" fill="url(#emeraldNeon)" opacity="0.15" filter="url(#glow)" />
    
    <!-- Lignes de vitesse dynamiques -->
    <path d="M-130 -30 L-80 -30" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <path d="M-150 10 L-90 10" stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <path d="M-130 50 L-80 50" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.6" />

    <!-- Écusson Principal -->
    <path d="M0 -130 L110 -55 L110 65 L0 140 L-110 65 L-110 -55 Z" fill="none" stroke="url(#emeraldNeon)" stroke-width="14" stroke-linejoin="round" />

    <!-- Ailes Athlétiques / Vitesse -->
    <path d="M-75 -35 L0 40 L75 -35" fill="none" stroke="url(#emeraldNeon)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M-55 10 L0 65 L55 10" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Flamme / Étoile Centrale Performance -->
    <circle cx="0" cy="-60" r="18" fill="url(#emeraldNeon)" filter="url(#glow)" />
    <path d="M0 -90 L10 -65 L35 -65 L15 -48 L22 -22 L0 -38 L-22 -22 L-15 -48 L-35 -65 L-10 -65 Z" fill="#ffffff" />
  </g>

  <!-- Typographie COACH PRO -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="8">COACH<tspan fill="#34d399">PRO</tspan></text>
  <text x="256" y="455" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="5">PERFORMANCE &amp; FORFAITS</text>
</svg>
