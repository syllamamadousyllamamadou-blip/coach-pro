<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>COACH PRO — Application Coach Sportif Privé</title>
  <meta name="description" content="Application professionnelle tout-en-un pour coach sportif privé : suivi athlètes, bilan corporel, abonnements en FCFA et impression Bluetooth." />
  <meta name="theme-color" content="#070b16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- PWA & Mobile Web App Mode -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="COACH PRO" />
  <meta name="apple-mobile-web-app-title" content="COACH PRO" />

  <!-- Anti Cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Feuille de styles hautement contrastée & professionnelle -->
  <link rel="stylesheet" href="css/style.css?v=3.3" />
</head>
<body class="bg-[#070b16] text-slate-100 flex flex-col md:flex-row min-h-screen">

  <!-- =========================================================================
       NAVIGATION LATERALE DESKTOP (Masquée sur Mobile)
       ========================================================================= -->
  <aside class="hidden md:flex md:w-64 bg-[#0a0f1d] border-r border-slate-800 flex-col justify-between p-4 z-40 shrink-0 sticky top-0 h-screen shadow-2xl">
    <div class="space-y-6">
      
      <!-- Logo COACH PRO -->
      <div class="flex items-center gap-3 px-2 py-1 cursor-pointer" onclick="window.App.navigateTo('dashboard')">
        <div class="w-10 h-10 rounded-2xl bg-slate-900 border border-emerald-500/40 p-1.5 flex items-center justify-center shadow-lg shadow-emerald-500/10">
          <img src="icon.svg" alt="Logo" class="w-full h-full object-contain" />
        </div>
        <div>
          <span class="text-sm font-black text-white tracking-wider block leading-tight">COACH <span class="text-emerald-400">PRO</span></span>
          <span class="text-[10px] text-slate-400 font-medium">Espace Coach Privé</span>
        </div>
      </div>

      <!-- Navigation Professionnelle -->
      <nav class="space-y-1.5">
        <button class="nav-link w-full text-left active" data-nav="dashboard">
          <span>📊</span>
          <span>Tableau de Bord</span>
        </button>

        <button class="nav-link w-full text-left" data-nav="clients">
          <span>👥</span>
          <span>Mes Clients</span>
        </button>

        <button class="nav-link w-full text-left" data-nav="accounting">
          <span>💰</span>
          <span>Comptabilité FCFA</span>
        </button>

        <button class="nav-link w-full text-left" onclick="window.App.openQRScanner()">
          <span>🔲</span>
          <span>Scanner un Reçu</span>
        </button>

        <button class="nav-link w-full text-left" onclick="window.App.openQuickToolsModal()">
          <span>⚡</span>
          <span>Calculateur Flash</span>
        </button>

        <button class="nav-link w-full text-left" onclick="window.App.openSettingsModal()">
          <span>⚙️</span>
          <span>Paramètres &amp; Imprimante</span>
        </button>

        <button class="nav-link w-full text-left text-rose-400 hover:text-rose-300" onclick="window.PinLock.lockApp()">
          <span>🔒</span>
          <span>Déconnexion</span>
        </button>
      </nav>
    </div>

    <!-- Pied de barre latérale -->
    <div class="pt-4 border-t border-slate-800 space-y-2">
      <div class="flex items-center justify-between px-2 cursor-pointer" onclick="window.App.openSettingsModal()">
        <div>
          <p class="text-xs font-bold text-white hover:text-emerald-400">Profil Coach</p>
          <span class="text-[10px] text-slate-400">Configuration</span>
        </div>
        <span class="text-sm">⚙️</span>
      </div>
    </div>
  </aside>

  <!-- =========================================================================
       ZONE PRINCIPALE
       ========================================================================= -->
  <main class="flex-1 flex flex-col min-w-0 min-h-screen pb-24 md:pb-8">
    
    <!-- Header Responsive (Mobile & Desktop) -->
    <header class="h-14 px-4 md:px-6 bg-[#0a0f1d]/95 backdrop-blur-md border-b border-slate-800 flex items-center justify-between sticky top-0 z-30 shadow-md">
      <div class="flex items-center gap-2.5 cursor-pointer" onclick="window.App.navigateTo('dashboard')">
        <div class="w-8 h-8 rounded-xl bg-slate-900 border border-emerald-500/40 p-1 flex md:hidden items-center justify-center">
          <img src="icon.svg" alt="Logo" class="w-full h-full object-contain" />
        </div>
        <span class="text-xs font-black text-white tracking-wider">COACH <span class="text-emerald-400">PRO</span></span>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="header-btn-scan-qr" class="btn btn-secondary btn-xs sm:btn-sm flex items-center gap-1 font-semibold" title="Scanner QR Reçu">
          <span>🔲</span>
          <span class="hidden sm:inline">Scan QR</span>
        </button>
        <button id="header-btn-quick-tools" class="btn btn-secondary btn-xs sm:btn-sm flex items-center gap-1 font-semibold" title="Calculateur">
          <span>⚡</span>
          <span class="hidden sm:inline">Calculateur</span>
        </button>
        <button id="header-btn-new-client" class="btn btn-primary btn-xs sm:btn-sm flex items-center gap-1 font-bold shadow-lg shadow-emerald-500/20">
          <span>+</span>
          <span>Nouveau Client</span>
        </button>
        <button onclick="window.PinLock.lockApp()" class="btn btn-outline btn-xs sm:btn-sm flex items-center gap-1 font-semibold text-slate-300 hover:text-rose-400" title="Verrouiller / Déconnexion">
          <span>🔒</span>
          <span class="hidden md:inline">Déconnexion</span>
        </button>
      </div>
    </header>

    <!-- Conteneur de Vue Principale -->
    <div id="main-content" class="flex-1 p-3 sm:p-5 md:p-8 max-w-6xl w-full mx-auto">
      <!-- Vue injectée dynamiquement par app.js -->
    </div>
  </main>

  <!-- =========================================================================
       BARRE DE NAVIGATION MOBILE BAS DE PAGE (App Native UX)
       ========================================================================= -->
  <nav id="mobile-bottom-nav" class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-[#0a0f1d]/95 backdrop-blur-lg border-t border-slate-800 px-2 py-1.5 flex items-center justify-around shadow-2xl">
    <button class="mobile-nav-btn active" data-nav="dashboard">
      <span class="text-lg">📊</span>
      <span class="text-[10px] font-bold">Bord</span>
    </button>

    <button class="mobile-nav-btn" data-nav="clients">
      <span class="text-lg">👥</span>
      <span class="text-[10px] font-bold">Clients</span>
    </button>

    <button class="mobile-nav-btn" onclick="window.App.openNewClientModal()">
      <div class="w-9 h-9 rounded-full bg-emerald-500 text-slate-950 flex items-center justify-center font-black text-lg shadow-lg shadow-emerald-500/30">
        +
      </div>
      <span class="text-[10px] font-bold text-emerald-400">Ajout</span>
    </button>

    <button class="mobile-nav-btn" data-nav="accounting">
      <span class="text-lg">💰</span>
      <span class="text-[10px] font-bold">Compta</span>
    </button>

    <button class="mobile-nav-btn" onclick="window.App.openQRScanner()">
      <span class="text-lg">🔲</span>
      <span class="text-[10px] font-bold">Scan</span>
    </button>
  </nav>

  <!-- =========================================================================
       MODAL 1 : FORMULAIRE CLIENT (Habitation, Profession, Forfaits & Bilan Auto)
       ========================================================================= -->
  <div id="client-form-modal" class="modal-backdrop hidden">
    <div class="modal-card max-w-3xl" id="client-form-container">
      <!-- Injecté par clientModal.js -->
    </div>
  </div>

  <!-- =========================================================================
       MODAL 2 : IMPRESSION DES 3 REÇUS (Bilan, Forfait & Programme en FCFA)
       ========================================================================= -->
  <div id="thermal-print-modal" class="modal-backdrop hidden">
    <div class="modal-card max-w-xl" id="thermal-print-modal-container">
      <!-- Injecté par thermalModal.js -->
    </div>
  </div>

  <!-- =========================================================================
       MODAL 3 : CALCULATEUR FLASH
       ========================================================================= -->
  <div id="quick-tools-modal" class="modal-backdrop hidden">
    <div class="modal-card max-w-xl" id="quick-tools-container">
      <!-- Injecté par quickTools.js -->
    </div>
  </div>

  <!-- =========================================================================
       MODAL 4 : PARAMÈTRES DU COACH & REÇUS
       ========================================================================= -->
  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal-card max-w-2xl" id="settings-modal-container">
      <!-- Injecté par settingsModal.js -->
    </div>
  </div>

  <!-- Toasts Notifications -->
  <div id="toast-container" class="fixed bottom-20 md:bottom-6 right-4 left-4 md:left-auto md:right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- App Entry Point : Script Universel Autonome (Web, Mobile, Android APK & local file://) -->
  <script defer src="js/bundle.js?v=3.3"></script>
</body>
</html>
