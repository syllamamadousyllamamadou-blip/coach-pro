<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>COACH PRO — Application Coach Sportif Privé</title>
  <meta name="description" content="Application professionnelle pour coach sportif privé : suivi athlètes, bilan corporel, forfaits en FCFA et impression thermique." />
  <meta name="theme-color" content="#0b0f19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- PWA & Mobile Web App Mode -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="COACH PRO" />
  <meta name="apple-mobile-web-app-title" content="COACH PRO" />

  <!-- Empêcher la mise en cache navigateur -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Feuille de styles sobre & professionnelle -->
  <link rel="stylesheet" href="css/style.css?v=3.2" />
</head>
<body class="bg-[#0b0f19] text-slate-100 flex flex-col md:flex-row min-h-screen">

  <!-- =========================================================================
       NAVIGATION LATERALE DESKTOP (Masquée sur Mobile)
       ========================================================================= -->
  <aside class="hidden md:flex md:w-60 bg-[#0f172a] border-r border-[#1f2937] flex-col justify-between p-4 z-40 shrink-0 sticky top-0 h-screen">
    <div class="space-y-6">
      
      <!-- Logo COACH PRO -->
      <div class="flex items-center gap-2.5 px-2 py-1 cursor-pointer" onclick="window.App.navigateTo('dashboard')">
        <div class="w-8 h-8 rounded bg-emerald-500 flex items-center justify-center text-slate-950 font-black text-sm tracking-wider">
          CP
        </div>
        <div>
          <span class="text-sm font-bold text-white tracking-wider block leading-none">COACH PRO</span>
          <span class="text-[10px] text-slate-400">Espace Coach</span>
        </div>
      </div>

      <!-- Navigation Professionnelle -->
      <nav class="space-y-1">
        <button class="nav-link w-full text-left active" data-nav="dashboard">
          <span>📊</span>
          <span>Tableau de Bord</span>
        </button>

        <button class="nav-link w-full text-left" data-nav="clients">
          <span>👥</span>
          <span>Mes Clients</span>
        </button>

        <button class="nav-link w-full text-left" onclick="window.App.openQuickToolsModal()">
          <span>⚡</span>
          <span>Calculateur Flash</span>
        </button>

        <button class="nav-link w-full text-left" onclick="window.App.openSettingsModal()">
          <span>⚙️</span>
          <span>Paramètres & Reçus</span>
        </button>
      </nav>
    </div>

    <!-- Pied de barre latérale -->
    <div class="pt-4 border-t border-[#1f2937] flex items-center justify-between">
      <div class="cursor-pointer" onclick="window.App.openSettingsModal()">
        <p class="text-xs font-semibold text-white px-2 hover:text-emerald-400">Profil Coach</p>
      </div>
      <button class="text-xs text-slate-400 hover:text-white px-2 py-1 rounded bg-slate-800" onclick="window.App.openSettingsModal()" title="Paramètres">
        Éditer
      </button>
    </div>
  </aside>

  <!-- =========================================================================
       ZONE PRINCIPALE
       ========================================================================= -->
  <main class="flex-1 flex flex-col min-w-0 min-h-screen pb-24 md:pb-8">
    
    <!-- Header Sobre Responsive (Mobile & Desktop) -->
    <header class="h-14 px-4 md:px-6 bg-[#0f172a]/90 backdrop-blur-md border-b border-[#1f2937] flex items-center justify-between sticky top-0 z-30">
      <div class="flex items-center gap-2.5 cursor-pointer" onclick="window.App.navigateTo('dashboard')">
        <div class="w-7 h-7 rounded bg-emerald-500 flex md:hidden items-center justify-center text-slate-950 font-black text-xs">
          CP
        </div>
        <span class="text-xs font-bold text-slate-200 tracking-wider">COACH PRO</span>
      </div>

      <div class="flex items-center gap-2">
        <button id="header-btn-quick-tools" class="btn btn-secondary btn-sm flex items-center gap-1">
          <span>⚡</span>
          <span class="hidden sm:inline">Calculateur</span>
        </button>
        <button id="header-btn-new-client" class="btn btn-primary btn-sm flex items-center gap-1 font-bold">
          <span>+</span>
          <span>Nouveau Client</span>
        </button>
      </div>
    </header>

    <!-- Conteneur de Vue Principale -->
    <div id="main-content" class="flex-1 p-3 sm:p-5 md:p-8 max-w-6xl w-full mx-auto">
      <!-- Vue injectée dynamiquement par app.js -->
    </div>
  </main>

  <!-- =========================================================================
       BARRE DE NAVIGATION MOBILE BAS DE PAGE (App Native UX)
       ========================================================================= -->
  <nav id="mobile-bottom-nav" class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-[#0f172a]/95 backdrop-blur-lg border-t border-[#1f2937] px-2 py-1.5 flex items-center justify-around">
    <button class="mobile-nav-btn active" data-nav="dashboard">
      <span class="text-lg">📊</span>
      <span class="text-[10px] font-medium">Bord</span>
    </button>

    <button class="mobile-nav-btn" data-nav="clients">
      <span class="text-lg">👥</span>
      <span class="text-[10px] font-medium">Clients</span>
    </button>

    <button class="mobile-nav-btn" onclick="window.App.openNewClientModal()">
      <div class="w-8 h-8 rounded-full bg-emerald-500 text-slate-950 flex items-center justify-center font-bold text-base shadow-lg shadow-emerald-500/20">
        +
      </div>
      <span class="text-[10px] font-semibold text-emerald-400">Ajout</span>
    </button>

    <button class="mobile-nav-btn" onclick="window.App.openQuickToolsModal()">
      <span class="text-lg">⚡</span>
      <span class="text-[10px] font-medium">Calcul</span>
    </button>

    <button class="mobile-nav-btn" onclick="window.App.openSettingsModal()">
      <span class="text-lg">⚙️</span>
      <span class="text-[10px] font-medium">Profil</span>
    </button>
  </nav>

  <!-- =========================================================================
       MODAL 1 : FORMULAIRE CLIENT (Habitation, Profession, Forfaits & Bilan Auto)
       ========================================================================= -->
  <div id="client-form-modal" class="modal-backdrop hidden">
    <div class="modal-card max-w-3xl" id="client-form-container">
      <!-- Injecté par clientModal.js -->
    </div>
  </div>

  <!-- =========================================================================
       MODAL 2 : IMPRESSION DES 3 REÇUS (Bilan, Forfait & Programme en FCFA)
       ========================================================================= -->
  <div id="thermal-print-modal" class="modal-backdrop hidden">
    <div class="modal-card max-w-lg" id="thermal-print-modal-container">
      <!-- Injecté par thermalModal.js -->
    </div>
  </div>

  <!-- =========================================================================
       MODAL 3 : CALCULATEUR FLASH
       ========================================================================= -->
  <div id="quick-tools-modal" class="modal-backdrop hidden">
    <div class="modal-card max-w-xl" id="quick-tools-container">
      <!-- Injecté par quickTools.js -->
    </div>
  </div>

  <!-- =========================================================================
       MODAL 4 : PARAMÈTRES DU COACH & REÇUS
       ========================================================================= -->
  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal-card max-w-lg" id="settings-modal-container">
      <!-- Injecté par settingsModal.js -->
    </div>
  </div>

  <!-- Toasts Notifications -->
  <div id="toast-container" class="fixed bottom-20 md:bottom-6 right-4 left-4 md:left-auto md:right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- App Entry Point avec anti-cache -->
  <script type="module" src="js/app.js?v=3.1"></script>
</body>
</html>
